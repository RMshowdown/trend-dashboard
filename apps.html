<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Store Charts</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <h1>App Store Charts · Thailand</h1>
    <nav>
      <a href="new.html">New Apps</a>
      <a href="opportunities.html">Opportunities</a>
      <a href="apps.html">Charts</a>
      <a href="play.html">Google Play</a>
      <a href="compare.html">Global</a>
      <a href="index.html">Google Trends</a>
      <a href="watchlist.html">★ Watchlist</a>
    </nav>
  </header>
  <p id="status">Loading…</p>

  <div class="controls">
    <label>Chart
      <select id="chart"></select>
    </label>
    <label>Category
      <select id="genre"></select>
    </label>
    <label>Show
      <select id="move">
        <option value="all" selected>All</option>
        <option value="up">Biggest climbers</option>
        <option value="down">Biggest fallers</option>
        <option value="new">New entries</option>
      </select>
    </label>
    <input type="search" id="search" placeholder="Search app or developer" aria-label="Search">
  </div>

  <div class="table-wrap">
    <table class="rtable">
      <thead>
        <tr>
          <th class="num">Rank</th>
          <th class="num">Change</th>
          <th>App</th>
          <th>Category</th>
          <th class="num" title="Days on this chart, out of the days tracked">Days on chart</th>
          <th class="num" id="trend-head">Rank trend</th>
        </tr>
      </thead>
      <tbody id="apps"></tbody>
    </table>
  </div>

  <script src="assets/common.js"></script>
  <script src="assets/apps.js"></script>
</body>
</html>
