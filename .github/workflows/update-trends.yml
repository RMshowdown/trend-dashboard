name: Update trends

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch app charts
        run: python scripts/fetch_apps.py

      - name: Fetch new apps
        run: python scripts/fetch_new_apps.py

      - name: Fetch Google Trends
        run: python scripts/fetch_trends.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trends.json data/apps.json data/new_apps.json
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update data $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed"
              exit 0
            fi
            echo "push failed, retrying in 5 seconds..."
            sleep 5
          done
          echo "push failed after 3 attempts"
          exit 1