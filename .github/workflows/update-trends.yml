name: Update trends

on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 Thailand time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Node ใช้อ่านข้อมูล Google Play (ชาร์ต จำนวนติดตั้ง รีวิว)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node packages
        id: npm
        continue-on-error: true
        run: npm ci --ignore-scripts

      - name: Fetch app charts
        run: python scripts/fetch_apps.py

      - name: Fetch new apps
        run: python scripts/fetch_new_apps.py

      # ข้อมูลต่างประเทศเป็นส่วนเสริม ถ้าล้มไม่ควรทำให้ข้อมูลไทยไม่ถูก commit
      - name: Fetch global charts
        id: global
        continue-on-error: true
        run: python scripts/fetch_global.py

      # Google Play ไม่มี API ทางการ อ่านจากหน้าเว็บ จึงอาจล้มได้ ไม่ให้กระทบข้อมูลส่วนอื่น
      - name: Fetch Google Play charts
        id: play
        if: steps.npm.outcome == 'success'
        continue-on-error: true
        run: node scripts/fetch_play.mjs

      - name: Score opportunities
        id: opps
        continue-on-error: true
        run: python scripts/fetch_opportunities.py

      - name: Fetch low-star reviews
        id: reviews
        if: steps.npm.outcome == 'success' && steps.opps.outcome == 'success'
        continue-on-error: true
        run: node scripts/fetch_reviews.mjs

      # Google Trends ไม่มี API ทางการและมักตอบ 429 จึงไม่ให้ขั้นนี้ทำให้ทั้งงานล้ม
      - name: Fetch Google Trends
        id: trends
        continue-on-error: true
        run: python scripts/fetch_trends.py

      - name: Warn about optional steps that failed
        if: >-
          steps.global.outcome == 'failure' || steps.trends.outcome == 'failure' ||
          steps.npm.outcome == 'failure' || steps.play.outcome == 'failure' ||
          steps.opps.outcome == 'failure' || steps.reviews.outcome == 'failure'
        run: |
          [ "${{ steps.npm.outcome }}" = "failure" ] && echo "::warning::npm install failed, Google Play data and reviews were not updated"
          [ "${{ steps.play.outcome }}" = "failure" ] && echo "::warning::Google Play fetch failed, play.json was not updated"
          [ "${{ steps.opps.outcome }}" = "failure" ] && echo "::warning::Opportunity scoring failed, opportunities.json was not updated"
          [ "${{ steps.reviews.outcome }}" = "failure" ] && echo "::warning::Review fetch failed, reviews were not updated"
          [ "${{ steps.global.outcome }}" = "failure" ] && echo "::warning::Global charts fetch failed, global.json was not updated"
          [ "${{ steps.trends.outcome }}" = "failure" ] && echo "::warning::Google Trends fetch failed, trends.json was not updated"
          true

      # commit ข้อมูลส่วนที่ดึงสำเร็จเสมอ แม้ขั้นก่อนหน้าบางขั้นจะล้ม
      - name: Commit and push updated data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update data $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed"
              exit 0
            fi
            echo "push failed, retrying in 5 seconds..."
            sleep 5
          done
          echo "push failed after 3 attempts"
          exit 1

      # ส่งสรุปเข้า Discord ถ้าตั้ง secret DISCORD_WEBHOOK_URL ไว้ (ไม่ตั้งก็ข้ามไปเฉย ๆ)
      - name: Send Discord report
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord.py
